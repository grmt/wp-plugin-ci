name: "Plugin checks"

# Checks every own WordPress plugin shares. Called from a plugin's CI with
# `uses: grmt/wp-plugin-ci/.github/workflows/plugin-checks.yml@main`.
#
# The PHP versions live here, in one place: PHP_FLOOR is the plugins'
# minimum and the servers' PHP, PHP_NEWEST the newest release. Raise them
# here when the servers move up; the "Declared PHP floor" job then fails
# every plugin that still states the old minimum.
on:
  workflow_call:
    inputs:
      slug:
        description: "Plugin folder name, e.g. avpvh-gallery."
        required: true
        type: string
      artifact:
        description: "Build artifact holding the plugin as installed. Empty: the repo itself is the plugin."
        required: false
        type: string
        default: ""
      ignore-codes:
        description: "Plugin Check codes to ignore, one per line."
        required: false
        type: string
        default: ""
      exclude-directories:
        description: "Directories Plugin Check skips, one per line."
        required: false
        type: string
        default: ""
      exclude-files:
        description: "Files Plugin Check skips (exact names), one per line."
        required: false
        type: string
        default: ""
      exclude-checks:
        description: "Plugin Check checks to skip, one per line."
        required: false
        type: string
        default: ""
      extra-plugins:
        description: "Other public plugin repos (owner/repo, main branch) to install next to this one, one per line."
        required: false
        type: string
        default: ""
      prefixes:
        description: "Prefixes every global name must start with, one per line (e.g. avpvh_flst). Empty: the prefix check is skipped."
        required: false
        type: string
        default: ""

env:
  PHP_FLOOR: "8.4"
  PHP_NEWEST: "8.5"

permissions:
  contents: read

jobs:
  versions:
    name: "PHP versions"
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.versions.outputs.matrix }}
    steps:
      - id: versions
        run: echo "matrix=[\"${PHP_FLOOR}\", \"${PHP_NEWEST}\"]" >> "$GITHUB_OUTPUT"

  prefix:
    name: "Global prefix"
    if: inputs.prefixes != ''
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        if: inputs.artifact == ''
        uses: actions/checkout@v7
        with:
          path: plugin

      - name: "Download build artifact"
        if: inputs.artifact != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact }}
          path: plugin

      - name: "Setup PHP"
        uses: shivammathur/setup-php@2.40.0
        with:
          php-version: ${{ env.PHP_FLOOR }}
          coverage: none
          tools: none

      - name: "Install WordPress Coding Standards"
        run: |
          composer global config --no-interaction allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          packages="wp-coding-standards/wpcs dealerdirect/phpcodesniffer-composer-installer"
          for attempt in 1 2 3; do
            composer global require --no-interaction --quiet $packages && exit 0
            echo "::warning::composer download failed (attempt ${attempt}), retrying"
            sleep $((attempt * 15))
          done
          composer global require --no-interaction --quiet --prefer-source $packages

      # WordPress' PrefixAllGlobals sniff: functions, classes, interfaces,
      # traits, constants, namespaces and hook names must start with one of
      # the prefixes (in any case: avpvh_flst also covers Avpvh_Flst_ and
      # AVPVH_FLST_). Global variables are left out: template files share
      # them with the code that includes them.
      - name: "Check that global names carry the plugin's prefix"
        env:
          PREFIXES: ${{ inputs.prefixes }}
        run: |
          {
            echo '<?xml version="1.0"?>'
            echo '<ruleset name="Global prefix">'
            echo '  <rule ref="WordPress.NamingConventions.PrefixAllGlobals">'
            echo '    <properties><property name="prefixes" type="array">'
            for prefix in $PREFIXES; do echo "      <element value=\"${prefix}\"/>"; done
            echo '    </property></properties>'
            echo '    <exclude name="WordPress.NamingConventions.PrefixAllGlobals.NonPrefixedVariableFound"/>'
            echo '  </rule>'
            echo '</ruleset>'
          } > "$RUNNER_TEMP/prefix.xml"
          cat "$RUNNER_TEMP/prefix.xml"
          "$(composer global config bin-dir --absolute)/phpcs" -p --colors --standard="$RUNNER_TEMP/prefix.xml" \
            --extensions=php --ignore='*/vendor/*,*/node_modules/*,*/tests/*' plugin

  naming:
    name: "Naming style"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        if: inputs.artifact == ''
        uses: actions/checkout@v7
        with:
          path: plugin

      - name: "Download build artifact"
        if: inputs.artifact != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact }}
          path: plugin

      - name: "Setup PHP"
        uses: shivammathur/setup-php@2.40.0
        with:
          php-version: ${{ env.PHP_FLOOR }}
          coverage: none
          tools: none

      # Functions, methods and properties: snake_case (WordPress) or camelCase
      # (PSR). Classes, interfaces, traits and enums: Capitalised_Words or
      # PascalCase. Never a mix within one name (eeSFL_UserCanSeeList).
      # Magic methods are exempt; vendor/, node_modules/, tests/ and .phan/
      # are skipped.
      - name: "Check that names don't mix WordPress and PSR style"
        run: |
          cat > "$RUNNER_TEMP/naming.php" <<'PHP'
          <?php
          // Names must follow WordPress style or PSR style, never a mix within one name.
          // Prints "file:line kind name" for each violation; exit 1 when there are any.
          $fn  = '/^(?:[a-z][a-zA-Z0-9]*|[a-z][a-z0-9]*(?:_[a-z0-9]+)+)$/';            // functions, methods, properties
          $cls = '/^(?:[A-Z][a-zA-Z0-9]*|[A-Z][A-Za-z0-9]*(?:_[A-Z0-9][A-Za-z0-9]*)+)$/'; // classes, interfaces, traits, enums
          $bad = 0;
          $it = new RecursiveIteratorIterator(new RecursiveDirectoryIterator('plugin', FilesystemIterator::SKIP_DOTS));
          foreach ($it as $f) {
              $path = $f->getPathname();
              if (substr($path, -4) !== '.php' || preg_match('#/(vendor|node_modules|tests?|\.phan)/#', $path)) { continue; }
              $toks = token_get_all(file_get_contents($path));
              $depth = 0; $classDepth = array(); $pending = false;
              for ($i = 0, $n = count($toks); $i < $n; $i++) {
                  $t = $toks[$i];
                  if (!is_array($t)) {
                      if ($t === '{') { $depth++; if ($pending) { $classDepth[] = $depth; $pending = false; } }
                      if ($t === '}') { if ($classDepth && end($classDepth) === $depth) { array_pop($classDepth); } $depth--; }
                      continue;
                  }
                  if (in_array($t[0], array(T_CURLY_OPEN, T_DOLLAR_OPEN_CURLY_BRACES), true)) { $depth++; continue; }
                  $next = function ($j) use ($toks) { while (isset($toks[$j]) && is_array($toks[$j]) && in_array($toks[$j][0], array(T_WHITESPACE, T_COMMENT, T_DOC_COMMENT), true)) { $j++; } return $j; };
                  $prev = function ($j) use ($toks) { while ($j >= 0 && is_array($toks[$j]) && in_array($toks[$j][0], array(T_WHITESPACE, T_COMMENT, T_DOC_COMMENT), true)) { $j--; } return $j; };
                  $inClass = $classDepth && end($classDepth) === $depth;
                  $kinds = array(T_CLASS => 'class', T_INTERFACE => 'interface', T_TRAIT => 'trait');
                  if (defined('T_ENUM')) { $kinds[T_ENUM] = 'enum'; }
                  if (isset($kinds[$t[0]])) {
                      $p = $prev($i - 1);
                      if ($p >= 0 && is_array($toks[$p]) && in_array($toks[$p][0], array(T_DOUBLE_COLON, T_NEW), true)) { continue; } // ::class, new class
                      $j = $next($i + 1);
                      if (is_array($toks[$j]) && $toks[$j][0] === T_STRING) {
                          $pending = true;
                          if (!preg_match($cls, $toks[$j][1])) { echo "::error file=" . substr($path, 7) . ",line={$toks[$j][2]}::{$kinds[$t[0]]} {$toks[$j][1]} mixes WordPress and PSR naming\n"; $bad++; }
                      } elseif ($toks[$j] === '(' || $toks[$j] === '{') { $pending = true; }
                      continue;
                  }
                  if ($t[0] === T_FUNCTION) {
                      $j = $next($i + 1); if ($toks[$j] === '&') { $j = $next($j + 1); }
                      if (is_array($toks[$j]) && $toks[$j][0] === T_STRING) {
                          $name = $toks[$j][1];
                          if (strpos($name, '__') === 0) { continue; } // magic methods
                          if (!preg_match($fn, $name)) { echo "::error file=" . substr($path, 7) . ",line={$toks[$j][2]}::" . ($inClass ? 'method' : 'function') . " $name mixes WordPress and PSR naming\n"; $bad++; }
                      }
                      continue;
                  }
                  if ($inClass && $t[0] === T_VARIABLE) {
                      // A property: a variable directly in the class body (not inside a method)
                      $p = $prev($i - 1);
                      $mods = array(T_PUBLIC, T_PROTECTED, T_PRIVATE, T_STATIC, T_VAR); if (defined('T_READONLY')) { $mods[] = T_READONLY; }
                      if ($p >= 0 && (is_array($toks[$p]) && (in_array($toks[$p][0], $mods, true) || in_array($toks[$p][0], array(T_STRING, T_ARRAY, T_CALLABLE), true) || (defined('T_NAME_QUALIFIED') && in_array($toks[$p][0], array(T_NAME_QUALIFIED, T_NAME_FULLY_QUALIFIED), true))) || $toks[$p] === '?' || $toks[$p] === ',')) {
                          $name = substr($t[1], 1);
                          if (!preg_match($fn, $name)) { echo "::error file=" . substr($path, 7) . ",line={$t[2]}::property $name mixes WordPress and PSR naming\n"; $bad++; }
                      }
                  }
              }
          }
          fwrite(STDERR, "$bad name(s) mix WordPress and PSR style\n");
          exit($bad ? 1 : 0);
          PHP
          php "$RUNNER_TEMP/naming.php"

  floor:
    name: "Declared PHP floor"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7
        with:
          path: source

      - name: "Download build artifact"
        if: inputs.artifact != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact }}
          path: build

      # The minimum PHP a plugin states must be the floor CI tests on. The
      # plugin header is checked on the plugin as installed (the build, when
      # there is one), composer.json on the source.
      - name: "Compare the declared minimums with PHP_FLOOR"
        env:
          PLUGIN_DIR: ${{ inputs.artifact != '' && 'build' || 'source' }}
        run: |
          python3 - <<'PY'
          import json, os, re, sys

          floor = os.environ["PHP_FLOOR"]
          plugin = os.environ["PLUGIN_DIR"]
          errors, found = [], []

          def mm(text):
              m = re.search(r"(\d+)\.(\d+)", text)
              return f"{m.group(1)}.{m.group(2)}" if m else None

          def field(path, name):
              with open(path, encoding="utf-8", errors="replace") as f:
                  head = f.read(8192)  # WordPress reads the first 8 KB too
              m = re.search(r"^[ \t/*#@]*" + re.escape(name) + r":(.*)$", head, re.M | re.I)
              return m.group(1).strip() if m else None

          def compare(where, value):
              found.append(f"{where}: {value}")
              if mm(value) != floor:
                  errors.append(f"{where} says {value}, the floor is {floor}")

          mains = [os.path.join(plugin, n) for n in sorted(os.listdir(plugin))
                   if n.endswith(".php") and field(os.path.join(plugin, n), "Plugin Name")]
          if not mains:
              errors.append(f"no plugin header (Plugin Name:) in a PHP file at the root of {plugin}/")
          for path in mains:
              value = field(path, "Requires PHP")
              if value:
                  compare(f"{os.path.basename(path)} Requires PHP", value)
              else:
                  errors.append(f"{os.path.basename(path)} has no 'Requires PHP:' header; WordPress uses it to refuse older PHP")

          readme = os.path.join(plugin, "readme.txt")
          if os.path.isfile(readme) and field(readme, "Requires PHP"):
              compare("readme.txt Requires PHP", field(readme, "Requires PHP"))

          composer = os.path.join("source", "composer.json")
          if os.path.isfile(composer):
              with open(composer, encoding="utf-8") as f:
                  data = json.load(f)
              constraint = data.get("require", {}).get("php")
              if constraint:
                  # The lowest version any alternative of the constraint allows
                  lows = [mm(alt) for alt in constraint.split("|") if mm(alt)]
                  lowest = min(lows, key=lambda v: tuple(map(int, v.split("."))), default=None)
                  found.append(f"composer.json require.php: {constraint}")
                  if lowest != floor:
                      errors.append(f"composer.json require.php is {constraint}, the floor is {floor}")
              platform = data.get("config", {}).get("platform", {}).get("php")
              if platform and mm(platform) != floor:
                  errors.append(f"composer.json config.platform.php is {platform}, the floor is {floor}")

          print("\n".join(found))
          for e in errors:
              print(f"::error::{e}")
          sys.exit(1 if errors else 0)
          PY

  platform:
    name: "Dependencies on PHP floor"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Setup PHP"
        uses: shivammathur/setup-php@2.40.0
        with:
          php-version: ${{ env.PHP_FLOOR }}
          coverage: none

      - name: "Check runtime dependencies"
        run: |
          if [ -f composer.lock ]; then
            composer check-platform-reqs --no-dev --lock
          else
            echo "No composer.lock; nothing to check."
          fi

  syntax:
    name: "PHP syntax (${{ matrix.php }})"
    runs-on: ubuntu-latest
    needs: versions
    strategy:
      matrix:
        php: ${{ fromJSON(needs.versions.outputs.matrix) }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Setup PHP"
        uses: shivammathur/setup-php@2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: "Lint PHP files"
        run: |
          find . -name '*.php' \
            -not -path './vendor/*' -not -path './node_modules/*' -not -path './dist/*' -not -path './.git/*' \
            -print0 | xargs -0 -n 1 -P 4 php -l -d display_errors=stderr > /dev/null

  compatibility:
    name: "PHP compatibility"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Setup PHP"
        uses: shivammathur/setup-php@2.40.0
        with:
          php-version: ${{ env.PHP_FLOOR }}
          coverage: none
          tools: none

      # GitHub's zipball API sometimes answers 504 for minutes on end: retry,
      # then fall back to cloning the packages instead of downloading zips.
      - name: "Install PHPCompatibilityWP"
        run: |
          composer global config --no-interaction allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          packages="squizlabs/php_codesniffer phpcompatibility/phpcompatibility-wp dealerdirect/phpcodesniffer-composer-installer"
          for attempt in 1 2 3; do
            composer global require --no-interaction --quiet $packages && exit 0
            echo "::warning::composer download failed (attempt ${attempt}), retrying"
            sleep $((attempt * 15))
          done
          composer global require --no-interaction --quiet --prefer-source $packages

      - name: "Check compatibility with the PHP floor and later"
        run: |
          "$(composer global config bin-dir --absolute)/phpcs" -p --colors \
            --standard=PHPCompatibilityWP --runtime-set testVersion "${PHP_FLOOR}-" \
            --extensions=php --ignore='*/vendor/*,*/node_modules/*,*/dist/*' .

  plugin-check:
    name: "Plugin check"
    runs-on: ubuntu-latest
    steps:
      - name: "Download build artifact"
        if: inputs.artifact != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact }}
          path: ${{ inputs.slug }}

      - name: "Checkout"
        if: inputs.artifact == ''
        uses: actions/checkout@v7
        with:
          path: ${{ inputs.slug }}

      - name: "Drop repository-only files"
        if: inputs.artifact == ''
        run: |
          rm -rf "${{ inputs.slug }}/.git" "${{ inputs.slug }}/.github"

      # Checked out from the repo, the plugin still needs its runtime vendor/.
      - name: "Setup PHP"
        if: inputs.artifact == '' && hashFiles(format('{0}/composer.json', inputs.slug)) != ''
        uses: shivammathur/setup-php@2.40.0
        with:
          php-version: ${{ env.PHP_FLOOR }}
          coverage: none

      - name: "Install runtime Composer dependencies"
        if: inputs.artifact == '' && hashFiles(format('{0}/composer.json', inputs.slug)) != ''
        working-directory: ${{ inputs.slug }}
        run: |
          composer install -n --prefer-dist --no-dev

      - name: "Checkout extra plugins"
        if: inputs.extra-plugins != ''
        env:
          EXTRA_PLUGINS: ${{ inputs.extra-plugins }}
          GH_TOKEN: ${{ github.token }}
        run: |
          for repo in $EXTRA_PLUGINS; do
            git clone --depth 1 "https://github.com/${repo}.git" "${repo#*/}"
          done

      # plugin-check-action v1 runs PHP 8.3 and overwrites .wp-env.json;
      # wp-env merges the override on top. The action mounts the plugin under
      # test via "mappings", so "plugins" here only adds the extra ones.
      # testsEnvironment false skips the tests containers Plugin Check never uses.
      - name: "Write wp-env override"
        env:
          EXTRA_PLUGINS: ${{ inputs.extra-plugins }}
        run: |
          plugins=$(for repo in $EXTRA_PLUGINS; do echo "./${repo#*/}"; done | jq -R . | jq -s -c .)
          jq -n --arg php "$PHP_FLOOR" --argjson plugins "$plugins" \
            '{phpVersion: $php, testsEnvironment: false} + (if ($plugins | length) > 0 then {plugins: $plugins} else {} end)' \
            > .wp-env.override.json
          cat .wp-env.override.json

      - name: "Run plugin check"
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: ${{ inputs.slug }}
          ignore-codes: ${{ inputs.ignore-codes }}
          exclude-directories: ${{ inputs.exclude-directories }}
          exclude-files: ${{ inputs.exclude-files }}
          exclude-checks: ${{ inputs.exclude-checks }}
