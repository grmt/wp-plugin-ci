name: "Tests and quality"

# Unit tests, coverage and SonarQube Cloud, shared by the own WordPress
# plugins. Called next to plugin-checks.yml:
#
#   quality:
#     uses: grmt/wp-plugin-ci/.github/workflows/quality.yml@main
#     permissions:
#       contents: read
#       id-token: write   # Codecov upload over OIDC, no token secret
#     secrets: inherit    # SONAR_TOKEN, when the repo has it
#
# A separate file from plugin-checks.yml because of id-token: GitHub checks a
# called workflow's permissions when the run starts, skipped jobs included,
# so asking for it there would fail every caller that doesn't grant it.
on:
  workflow_call:
    inputs:
      phpunit:
        description: "Run vendor/bin/phpunit (from the repo's composer.json) on the floor and the newest PHP, with coverage on the floor."
        required: false
        type: boolean
        default: true
      wordpress-tests:
        description: "Also run the WordPress integration tests: phpunit-wordpress.xml.dist against the WordPress test suite with MySQL, on PHPUnit 9.6 (what the WordPress test suite supports)."
        required: false
        type: boolean
        default: false
      sonar-exclusions:
        description: "Comma-separated paths SonarQube Cloud skips, on top of vendor, node_modules, dist and the tests directory."
        required: false
        type: string
        default: ""
      tests-directory:
        description: "Directory with the tests, analysed by SonarQube Cloud as test code."
        required: false
        type: string
        default: "tests"
    secrets:
      SONAR_TOKEN:
        description: "SonarQube Cloud token. Without it the SonarQube Cloud job is skipped."
        required: false

# Keep in step with PHP_FLOOR and PHP_NEWEST in plugin-checks.yml.
# WP_FLOOR is the plugins' minimum WordPress (the latest release, see CLAUDE.md).
env:
  PHP_FLOOR: "8.4"
  PHP_NEWEST: "8.5"
  WP_FLOOR: "7.1"

permissions:
  contents: read

jobs:
  versions:
    name: "PHP versions"
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.versions.outputs.matrix }}
      floor: ${{ steps.versions.outputs.floor }}
      wordpress: ${{ steps.versions.outputs.wordpress }}
    steps:
      - id: versions
        run: |
          echo "matrix=[\"${PHP_FLOOR}\", \"${PHP_NEWEST}\"]" >> "$GITHUB_OUTPUT"
          echo "floor=${PHP_FLOOR}" >> "$GITHUB_OUTPUT"
          # WordPress: the newest patch release of WP_FLOOR, and the newest release
          # (the same version until the next major is out).
          versions=$(curl -fsS https://api.wordpress.org/core/stable-check/1.0/)
          floor_wp=$(jq -r --arg f "$WP_FLOOR" '[keys[] | select(. == $f or startswith($f + "."))] | sort_by(split(".") | map(tonumber)) | last' <<<"$versions")
          newest_wp=$(jq -r '[to_entries[] | select(.value == "latest") | .key] | first' <<<"$versions")
          echo "wordpress=$(jq -c -n --arg a "$floor_wp" --arg b "$newest_wp" '[$a, $b] | unique')" >> "$GITHUB_OUTPUT"

  phpunit:
    name: "PHPUnit (PHP ${{ matrix.php }})"
    if: inputs.phpunit
    needs: versions
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        php: ${{ fromJSON(needs.versions.outputs.matrix) }}
    env:
      COVERAGE: ${{ matrix.php == needs.versions.outputs.floor }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Setup PHP"
        uses: shivammathur/setup-php@2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: ${{ matrix.php == needs.versions.outputs.floor && 'pcov' || 'none' }}

      - name: "Install Composer dependencies"
        run: composer install -n --prefer-dist --no-progress

      - name: "PHPUnit"
        run: |
          if [ "$COVERAGE" = "true" ]; then
            vendor/bin/phpunit --coverage-clover coverage.xml
          else
            vendor/bin/phpunit
          fi

      # Informational: a failed upload doesn't fail CI. Dependabot's pull
      # requests may get no OIDC token.
      - name: "Upload coverage to Codecov"
        if: env.COVERAGE == 'true'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: coverage.xml
          fail_ci_if_error: false

      - name: "Keep coverage for SonarQube Cloud"
        if: env.COVERAGE == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-clover
          path: coverage.xml
          retention-days: 1

  wordpress:
    name: "WordPress tests (PHP ${{ matrix.php }}, WordPress ${{ matrix.wordpress }})"
    if: inputs.wordpress-tests
    needs: versions
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        php: ${{ fromJSON(needs.versions.outputs.matrix) }}
        wordpress: ${{ fromJSON(needs.versions.outputs.wordpress) }}
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      COVERAGE: ${{ matrix.php == needs.versions.outputs.floor && matrix.wordpress == fromJSON(needs.versions.outputs.wordpress)[0] }}
      WP_VERSION: ${{ matrix.wordpress }}
      WP_CORE_DIR: ${{ github.workspace }}/../wordpress
      WP_TESTS_DIR: ${{ github.workspace }}/../wordpress-tests/tests/phpunit
      WP_TESTS_PHPUNIT_POLYFILLS_PATH: ${{ github.workspace }}/../phpunit9/vendor/yoast/phpunit-polyfills
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Setup PHP"
        uses: shivammathur/setup-php@2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli
          coverage: ${{ env.COVERAGE == 'true' && 'pcov' || 'none' }}

      # The plugin's own runtime dependencies; its dev tools (a newer PHPUnit
      # for the unit tests) are not used here.
      - name: "Install Composer dependencies"
        if: hashFiles('composer.json') != ''
        run: composer install -n --prefer-dist --no-progress

      # The WordPress test suite runs on PHPUnit 9.6 with the PHPUnit Polyfills,
      # kept apart from the repo's vendor/.
      - name: "Install PHPUnit 9.6"
        run: |
          mkdir -p ../phpunit9
          composer -n -d ../phpunit9 require --no-progress phpunit/phpunit:^9.6 yoast/phpunit-polyfills:^1.1

      - name: "Install WordPress ${{ matrix.wordpress }} and its test suite"
        run: |
          mkdir -p "$WP_CORE_DIR"
          curl -fsSL "https://wordpress.org/wordpress-${WP_VERSION}.tar.gz" | tar -xz --strip-components=1 -C "$WP_CORE_DIR"
          git clone -q --depth 1 --branch "$WP_VERSION" --filter=blob:none --sparse \
            https://github.com/WordPress/wordpress-develop.git ../wordpress-tests
          git -C ../wordpress-tests sparse-checkout set tests/phpunit/includes tests/phpunit/data
          sed -e "s:dirname( __FILE__ ) . '/src/':'${WP_CORE_DIR}/':" \
              -e "s:__DIR__ . '/src/':'${WP_CORE_DIR}/':" \
              -e "s/youremptytestdbnamehere/wordpress_test/" \
              -e "s/yourusernamehere/root/" \
              -e "s/yourpasswordhere/root/" \
              -e "s|localhost|127.0.0.1:3306|" \
              ../wordpress-tests/wp-tests-config-sample.php > ../wordpress-tests/wp-tests-config.php
          grep -q "${WP_CORE_DIR}/" ../wordpress-tests/wp-tests-config.php

      - name: "PHPUnit (WordPress)"
        run: |
          if [ "$COVERAGE" = "true" ]; then
            ../phpunit9/vendor/bin/phpunit -c phpunit-wordpress.xml.dist --coverage-clover coverage-wordpress.xml
          else
            ../phpunit9/vendor/bin/phpunit -c phpunit-wordpress.xml.dist
          fi

      - name: "Upload coverage to Codecov"
        if: env.COVERAGE == 'true'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: coverage-wordpress.xml
          flags: wordpress
          fail_ci_if_error: false

      - name: "Keep coverage for SonarQube Cloud"
        if: env.COVERAGE == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-wordpress
          path: coverage-wordpress.xml
          retention-days: 1

  sonar:
    name: "SonarQube Cloud"
    needs: [phpunit, wordpress]
    # Also when a test job is off (skipped); not when tests failed.
    if: ${{ !cancelled() && needs.phpunit.result != 'failure' && needs.wordpress.result != 'failure' }}
    runs-on: ubuntu-latest
    steps:
      # Forks and Dependabot's pull requests get no secrets: skip, don't fail.
      - name: "Check for SONAR_TOKEN"
        id: token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::notice::No SONAR_TOKEN secret: SonarQube Cloud analysis skipped."
            echo "SonarQube Cloud analysis skipped: no \`SONAR_TOKEN\` secret." >> "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: "Checkout"
        if: steps.token.outputs.run == 'true'
        uses: actions/checkout@v7
        with:
          # Full history: SonarQube Cloud uses blame for new-code detection.
          fetch-depth: 0

      - name: "Download coverage"
        if: steps.token.outputs.run == 'true' && (needs.phpunit.result == 'success' || needs.wordpress.result == 'success')
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          merge-multiple: true

      - name: "Analysis settings"
        if: steps.token.outputs.run == 'true'
        id: settings
        env:
          TESTS: ${{ inputs.tests-directory }}
          EXTRA_EXCLUSIONS: ${{ inputs.sonar-exclusions }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          exclusions="vendor/**,node_modules/**,dist/**"
          [ -n "$EXTRA_EXCLUSIONS" ] && exclusions="${exclusions},${EXTRA_EXCLUSIONS}"
          {
            echo "sonar.organization=${OWNER}"
            echo "sonar.projectKey=${OWNER}_${REPO}"
            # The name follows the repo, also after a rename: SonarQube Cloud
            # can't edit it in its interface.
            echo "sonar.projectName=${REPO}"
            echo "sonar.sources=."
            if [ -n "$TESTS" ] && [ -d "$TESTS" ]; then
              echo "sonar.tests=${TESTS}"
              exclusions="${exclusions},${TESTS}/**"
            fi
            echo "sonar.exclusions=${exclusions}"
            reports=$(ls coverage.xml coverage-wordpress.xml 2>/dev/null | paste -sd, -)
            [ -n "$reports" ] && echo "sonar.php.coverage.reportPaths=${reports}"
            # The repo's own settings (rule exceptions, test inclusions),
            # the file Automatic Analysis reads. Last, so a key set there
            # replaces the generated one.
            if [ -f .sonarcloud.properties ]; then
              echo "# --- .sonarcloud.properties"
              cat .sonarcloud.properties
              echo
            fi
          } > "$RUNNER_TEMP/sonar.properties"
          cat "$RUNNER_TEMP/sonar.properties"
          echo "file=$RUNNER_TEMP/sonar.properties" >> "$GITHUB_OUTPUT"

      - name: "SonarQube Cloud scan"
        if: steps.token.outputs.run == 'true'
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dproject.settings=${{ steps.settings.outputs.file }}
